{% extends "base.html" %}
{% block title %}{{ item.title }} — Персональний блог{% endblock %}

{% block content %}
<article class="blog-post">
    <header>
        <h1 class="blog-post-title">{{ item.title }}</h1>
        <p class="blog-post-meta">{{ item.pub_date|date:"d E Y" }}</p>
    </header>
    <img src="{{ item.cover_image_url }}" class="blog-post-image" alt="{{ item.title }}">
    {% if images %}
        <div class="blog-post-gallery" aria-label="Фотографії до статті">
            {% for photo in images %}
                <figure class="gallery-item">
                    <img src="{{ photo.image.url }}" alt="{{ photo.title|default:item.title }}">
                    {% if photo.title %}
                        <figcaption>{{ photo.title }}</figcaption>
                    {% endif %}
                </figure>
            {% endfor %}
        </div>
    {% endif %}
    <div class="blog-post-content">
        {{ item.body|linebreaks }}
    </div>
</article>
{% endblock %}
